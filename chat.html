<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MyChat</title>

<link rel="stylesheet" href="css/chat.css">

</head>

<body>

<div class="chat">

    <!-- Header -->

    <header class="chat-header">

        <button id="back">

            ⬅

        </button>

        <img id="userPhoto" class="avatar">

        <div>

            <h3 id="userName"></h3>

            <small id="userStatus"></small>

        </div>

        <button id="groupSettings" style="display:none;">
            ⚙️ إدارة الجروب
        </button>

    </header>

    <!-- Messages -->

    <main id="messages" class="messages">

    </main>

    <!-- Footer -->

    <footer class="chat-footer">

        <input
        id="message"
        type="text"
        placeholder="اكتب رسالة...">

        <button id="send">

            إرسال

        </button>

    </footer>

</div>

<script type="module" src="js/chat.js"></script>

</body>

</html>
