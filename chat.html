<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>MyChat</title>

    <link
        rel="stylesheet"
        href="css/chat.css"
    >

</head>

<body>

<div class="chat">

    <!-- Header -->

    <header class="chat-header">

        <button id="back">
            ⬅
        </button>

        <img
            id="userPhoto"
            class="avatar"
            alt="صورة المستخدم"
        >

        <div class="chat-user-info">

            <h3 id="userName"></h3>

            <small id="userStatus"></small>

        </div>

        <!-- Menu -->

        <button
            id="chatMenuBtn"
            class="chat-menu-btn"
            type="button"
        >
            ⋮
        </button>

        <div
            id="chatMenu"
            class="chat-menu"
        >

            <button
                id="blockUser"
                type="button"
            >
                🚫 حظر المستخدم
            </button>

        </div>

    </header>


    <!-- Messages -->

    <main
        id="messages"
        class="messages"
    ></main>


    <!-- Footer -->

    <footer class="chat-footer">

        <input
            id="message"
            type="text"
            placeholder="اكتب رسالة..."
            autocomplete="off"
        >

        <button
            id="send"
            type="button"
        >
            إرسال
        </button>

    </footer>

</div>


<script
    type="module"
    src="js/chat.js"
></script>

</body>

</html>
