<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MyChat</title>

    <link
        rel="stylesheet"
        href="css/home.css"
    >

</head>

<body>

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="top">

            <img
                id="myPhoto"
                class="avatar"
                alt="صورتي"
            >

            <div>

                <h3 id="myName"></h3>

                <small id="myStatus">
                    Online
                </small>

            </div>

        </div>


        <!-- Search -->

        <div class="search">

            <input
                id="search"
                type="text"
                placeholder="ابحث عن مستخدم"
                autocomplete="off"
            >

        </div>


        <!-- النتائج -->

        <div
            id="results"
            class="results"
        ></div>


        <!-- المحادثات -->

        <div
            id="chatList"
            class="chat-list"
        ></div>

    </aside>


    <!-- Main -->

    <main class="main">


        <!-- Tabs -->

        <div class="tabs">

            <button
                class="tab active"
                data-tab="welcome"
            >
                الرئيسية
            </button>


            <button
                class="tab"
                data-tab="requests"
            >
                الطلبات
            </button>


            <button
                class="tab"
                data-tab="groups"
            >
                الجروبات
            </button>


            <button
                class="tab"
                data-tab="profile"
            >
                حسابي
            </button>

        </div>


        <!-- Welcome -->

        <section
            id="welcome"
            class="page active"
        >

            <h1>
                👋 أهلاً بك فى MyChat
            </h1>

            <p>
                ابحث عن مستخدم لبدء محادثة.
            </p>

        </section>


        <!-- Requests -->

        <section
            id="requests"
            class="page"
        >

            <h2>
                طلبات الصداقة
            </h2>

            <div
                id="requestsList"
            ></div>

        </section>


        <!-- Groups -->

        <section
            id="groups"
            class="page"
        >

            <button
                id="newGroup"
                type="button"
            >
                إنشاء جروب
            </button>

            <div
                id="groupsList"
            ></div>

        </section>


        <!-- Profile -->

        <section
            id="profile"
            class="page"
        >

            <img
                id="profilePhoto"
                class="big-avatar"
                alt="الصورة الشخصية"
            >

            <h2
                id="profileName"
            ></h2>

            <p
                id="profileBio"
            ></p>


            <button
                id="logout"
                type="button"
            >
                تسجيل الخروج
            </button>

        </section>

    </main>


    <script
        type="module"
        src="js/home.js"
    ></script>

</body>

</html>
