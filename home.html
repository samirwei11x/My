<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MyChat</title>

    <link
        rel="stylesheet"
        href="css/home.css"
    >

</head>

<body>

<div class="app">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="user-info">

            <img
                id="myPhoto"
                class="avatar"
                src=""
                alt="صورة المستخدم"
            >

            <div>

                <h3 id="myName"></h3>

                <small id="myStatus"></small>

            </div>

        </div>

    </header>


    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav class="tabs">

        <button
            class="tab active"
            data-tab="homePage"
        >
            الرئيسية
        </button>

        <button
            class="tab"
            data-tab="requestsPage"
        >
            الطلبات
        </button>

        <button
            class="tab"
            data-tab="groupsPage"
        >
            الجروبات
        </button>

        <button
            class="tab"
            data-tab="profilePage"
        >
            حسابي
        </button>

    </nav>


    <!-- =========================
         MAIN
    ========================== -->

    <main>


        <!-- =====================
             HOME
        ====================== -->

        <section
            id="homePage"
            class="page active"
        >

            <div class="search-box">

                <input
                    id="search"
                    type="text"
                    placeholder="ابحث عن مستخدم..."
                >

            </div>


            <div id="results"></div>


            <h2>
                المحادثات
            </h2>

            <div id="chatList"></div>

        </section>



        <!-- =====================
             REQUESTS
        ====================== -->

        <section
            id="requestsPage"
            class="page"
        >

            <h2>
                طلبات الصداقة
            </h2>

            <div id="requestsList"></div>


            <h2>
                طلبات دخول الجروبات
            </h2>

            <div id="groupRequestsList"></div>

        </section>



        <!-- =====================
             GROUPS
        ====================== -->

        <section
            id="groupsPage"
            class="page"
        >

            <div class="groups-header">

                <h2>
                    الجروبات
                </h2>

                <button id="newGroup">
                    إنشاء جروب
                </button>

            </div>


            <div id="groupsList"></div>

        </section>



        <!-- =====================
             PROFILE
        ====================== -->

        <section
            id="profilePage"
            class="page"
        >

            <div class="profile">

                <img
                    id="profilePhoto"
                    class="profile-avatar"
                    src=""
                    alt="صورة الحساب"
                >

                <h2 id="profileName"></h2>

                <p id="profileBio"></p>


                <label>
                    اسم المستخدم
                </label>

                <input
                    id="profileUsername"
                    type="text"
                    placeholder="اسم المستخدم"
                >


                <label>
                    رابط الصورة
                </label>

                <input
                    id="photoUrl"
                    type="text"
                    placeholder="رابط الصورة"
                >


                <label>
                    النبذة
                </label>

                <textarea
                    id="profileBioInput"
                    placeholder="اكتب نبذة عنك..."
                ></textarea>


                <button id="saveProfile">
                    حفظ التعديلات
                </button>


                <button
                    id="logout"
                    class="logout"
                >
                    تسجيل الخروج
                </button>

            </div>

        </section>


    </main>

</div>


<script
    type="module"
    src="js/home.js"
></script>

</body>

</html>
